<!-- =========================================
     VELNOX FLOATING CONTACT
========================================= -->

<div class="floating-contact">

    <!-- INSTAGRAM -->

    <a
        href="https://www.instagram.com/velnox.web/"
        class="floating-contact-btn instagram-btn"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit VELNOX on Instagram"
    >

        <span class="floating-icon">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                ></rect>

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                ></circle>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1"
                    class="icon-dot"
                ></circle>

            </svg>

        </span>


        <span class="floating-content">

            <span class="floating-label">
                Follow us
            </span>

            <span class="floating-title">
                @velnox.web
            </span>

        </span>

    </a>


    <!-- EMAIL -->

    <a
        href="mailto:velnox.webstudio@gmail.com"
        class="floating-contact-btn email-btn"
        aria-label="Email VELNOX"
    >

        <span class="floating-icon">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2"
                ></rect>

                <path
                    d="M4 7L12 13L20 7"
                ></path>

            </svg>

        </span>


        <span class="floating-content">

            <span class="floating-label">
                Email us
            </span>

            <span class="floating-title">
                VELNOX Email
            </span>

        </span>

    </a>

</div>
