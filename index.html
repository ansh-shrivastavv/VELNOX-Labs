    <!-- ================================
         LOAD COMPONENTS
    ================================= -->

    <script>

        async function loadComponent(id, file) {

            try {

                const response = await fetch(file);

                if (!response.ok) {
                    throw new Error(`Failed to load ${file}`);
                }

                const html = await response.text();

                const element = document.getElementById(id);

                if (element) {
                    element.innerHTML = html;
                }

            } catch (error) {

                console.error(
                    `Component Error: ${file}`,
                    error
                );

            }

        }


        Promise.all([

            loadComponent(
                "navbar",
                "HTML/navbar.html"
            ),

            loadComponent(
                "hero",
                "HTML/hero.html"
            ),

            loadComponent(
                "about",
                "HTML/about.html"
            ),

            loadComponent(
                "services",
                "HTML/services.html"
            ),

            loadComponent(
                "works",
                "HTML/works.html"
            ),

            loadComponent(
                "team",
                "HTML/team.html"
            ),

            loadComponent(
                "estimator",
                "HTML/estimator.html"
            ),

            loadComponent(
                "contact",
                "HTML/contact.html"
            ),

            loadComponent(
                "location",
                "HTML/location.html"
            ),

            loadComponent(
                "footer",
                "HTML/footer.html"
            )

        ]);

    </script>


    <!-- ================================

    <script src="JS/navbar.js" defer></script>
