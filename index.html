<!DOCTYPE html>
<html lang="en">

<head>

    ================================= -->

    <!-- ================================

    ================================= -->

    >


    <!-- ================================

    ================================= -->

    >

        rel="manifest"
        href="manifest.webmanifest"
    >


    <!-- ================================
         VERCEL SPEED INSIGHTS
    ================================= -->

    <script>
        window.si = window.si || function () {
            (window.siq = window.siq || []).push(arguments);
        };
    </script>

    <script
        defer
        src="/_vercel/speed-insights/script.js">
    </script>


    <!-- ================================
         OPEN GRAPH
    ================================= -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="VELNOX Web Labs | Premium Web Development Agency"
    >

    <meta
        property="og:description"
        content="Premium websites, web applications, UI/UX design and digital solutions."
    >

    <meta
        property="og:url"
        content="https://velnox-labs-eight.vercel.app/"
    >

    <meta
        property="og:image"
        content="https://velnox-labs-eight.vercel.app/assets/favicon.png"
    >


    <!-- ================================
         CSS
    ================================= -->

    <link rel="stylesheet" href="CSS/navbar.css">
    <link rel="stylesheet" href="CSS/hero.css">
    <link rel="stylesheet" href="CSS/about.css">
    <link rel="stylesheet" href="CSS/services.css">
    <link rel="stylesheet" href="CSS/works.css">
    <link rel="stylesheet" href="CSS/team.css">
    <link rel="stylesheet" href="CSS/estimator.css">
    <link rel="stylesheet" href="CSS/contact.css">
    <link rel="stylesheet" href="CSS/location.css">
    <link rel="stylesheet" href="CSS/footer.css">

    <link
        rel="stylesheet"
        href="CSS/floating-instagram.css"
    >


    <!-- ================================
         GSAP
    ================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js">
    </script>

</head>


<body>


    <!-- ================================
         NAVBAR
    ================================= -->

    <div id="navbar"></div>


    <!-- ================================
         HERO
    ================================= -->

    <section
        id="hero-section"
        aria-label="Hero Section"
    >

        <div id="hero"></div>

    </section>


    <!-- ================================
         ABOUT
    ================================= -->

    <section
        id="about-section"
        aria-label="About VELNOX"
    >

        <div id="about"></div>

    </section>


    <!-- ================================
         SERVICES
    ================================= -->

    <section
        id="services-section"
        aria-label="Services"
    >

        <div id="services"></div>

    </section>


    <!-- ================================
         WORKS
    ================================= -->

    <section
        id="works-section"
        aria-label="Portfolio"
    >

        <div id="works"></div>

    </section>


    <!-- ================================
         TEAM
    ================================= -->

    <section
        id="team-section"
        aria-label="Our Team"
    >

        <div id="team"></div>

    </section>


    <!-- ================================
         ESTIMATOR
    ================================= -->

    <section
        id="estimator-section"
        aria-label="Project Estimator"
    >

        <div id="estimator"></div>

    </section>


    <!-- ================================
         CONTACT
    ================================= -->

    <section
        id="contact-section"
        aria-label="Contact"
    >

        <div id="contact"></div>

    </section>


    <!-- ================================
         LOCATION
    ================================= -->

    <section
        id="location-section"
        aria-label="Location"
    >

        <div id="location"></div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer id="footer-section">

        <div id="footer"></div>

    </footer>


    <!-- ================================
         FLOATING INSTAGRAM
    ================================= -->

    <div id="floating-instagram"></div>


    <!-- ================================
         LOAD EVERYTHING
    ================================= -->

    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            /* =========================================
               COMPONENT LOADER
            ========================================= */

            async function loadComponent(id, file) {

                try {

                    const response = await fetch(file);

                    if (!response.ok) {

                        throw new Error(
                            `Failed to load ${file}`
                        );

                    }

                    const html = await response.text();

                    const element =
                        document.getElementById(id);

                    if (element) {

                        element.innerHTML = html;

                    }

                } catch (error) {

                    console.error(
                        `Component Error: ${file}`,
                        error
                    );

                }

            }


            /* =========================================
               LOAD ALL COMPONENTS
            ========================================= */

            await Promise.all([

                loadComponent(
                    "navbar",
                    "HTML/navbar.html"
                ),

                loadComponent(
                    "hero",
                    "HTML/hero.html"
                ),

                loadComponent(
                    "about",
                    "HTML/about.html"
                ),

                loadComponent(
                    "services",
                    "HTML/services.html"
                ),

                loadComponent(
                    "works",
                    "HTML/works.html"
                ),

                loadComponent(
                    "team",
                    "HTML/team.html"
                ),

                loadComponent(
                    "estimator",
                    "HTML/estimator.html"
                ),

                loadComponent(
                    "contact",
                    "HTML/contact.html"
                ),

                loadComponent(
                    "location",
                    "HTML/location.html"
                ),

                loadComponent(
                    "footer",
                    "HTML/footer.html"
                ),

                loadComponent(
                    "floating-instagram",
                    "HTML/floating-instagram.html"
                )

            ]);


            /* =========================================
               LOAD JS AFTER COMPONENTS
            ========================================= */

            const scripts = [

                "JS/navbar.js",
                "JS/hero.js",
                "JS/about.js",
                "JS/services.js",
                "JS/works.js",
                "JS/team.js",
                "JS/estimator.js",
                "JS/contact.js",
                "JS/location.js",
                "JS/footer.js",
                "JS/floating-instagram.js",
                "JS/project-modal.js"

            ];


            /* =========================================
               SCRIPT LOADER
            ========================================= */

            function loadScript(src) {

                return new Promise((resolve, reject) => {

                    const script =
                        document.createElement("script");

                    script.src = src;

                    script.onload = resolve;

                    script.onerror = reject;

                    document.body.appendChild(script);

                });

            }


            /* =========================================
               LOAD SECTION JS
            ========================================= */

            for (const script of scripts) {

                try {

                    await loadScript(script);

                } catch (error) {

                    console.warn(
                        `Could not load ${script}`,
                        error
                    );

                }

            }


            /* =========================================
               SCROLL ANIMATION
            ========================================= */

            try {

                await loadScript(
                    "JS/scroll-animation.js"
                );

            } catch (error) {

                console.error(
                    "Scroll animation failed:",
                    error
                );

            }


            /* =========================================
               REFRESH GSAP
            ========================================= */

            if (
                typeof ScrollTrigger !== "undefined"
            ) {

                setTimeout(() => {

                    ScrollTrigger.refresh();

                }, 500);

            }


            console.log(
                "✓ VELNOX Website Fully Loaded"
            );

        });

    </script>


</body>

</html>
