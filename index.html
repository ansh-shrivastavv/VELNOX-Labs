<!-- =====================================================
     LOAD HTML COMPONENTS
====================================================== -->

<script>

    async function loadComponent(id, file) {

        try {

            const response = await fetch(file);

            if (!response.ok) {
                throw new Error(
                    `Failed to load ${file}`
                );
            }

            document.getElementById(id).innerHTML =
                await response.text();

        } catch (error) {

            console.error(
                `Component loading error: ${file}`,
                error
            );

        }

    }


    Promise.all([

        loadComponent(
            "navbar",
            "HTML/navbar.html"
        ),

        loadComponent(
            "hero",
            "HTML/hero.html"
        ),

        loadComponent(
            "about",
            "HTML/about.html"
        ),

        loadComponent(
            "services",
            "HTML/services.html"
        ),

        loadComponent(
            "works",
            "HTML/works.html"
        ),

        loadComponent(
            "contact",
            "HTML/contact.html"
        ),

        loadComponent(
            "footer",
            "HTML/footer.html"
        )

    ]);

</script>
