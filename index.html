    <!-- Load HTML Components -->

    <script>

    async function loadComponent(id, file) {

        const response = await fetch(file);

        document.getElementById(id).innerHTML =
        await response.text();

    }


    Promise.all([

        loadComponent("navbar", "HTML/navbar.html"),

        loadComponent("hero", "HTML/hero.html"),

        loadComponent("about", "HTML/about.html"),

        loadComponent("services", "HTML/services.html"),
        loadComponent("upcoming", "HTML/upcoming.html"),

        loadComponent("works", "HTML/works.html"),

        loadComponent("contact", "HTML/contact.html"),

        loadComponent("footer", "HTML/footer.html")
