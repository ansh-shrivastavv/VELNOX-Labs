    <!-- =====================================================
         COMPONENT LOADER
    ====================================================== -->

    <script>

        async function loadComponent(
            id,
            file
        ) {

            try {

                const response =
                    await fetch(file);


                if (!response.ok) {

                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );

                }


                const html =
                    await response.text();


                const element =
                    document.getElementById(id);


                if (!element) {

                    console.warn(
                        `VELNOX: #${id} not found.`
                    );

                    return;

                }


                element.innerHTML = html;


            } catch (error) {

                console.error(
                    `VELNOX Component Error: ${file}`,
                    error
                );

            }

        }


        async function loadScript(
            file
        ) {

            return new Promise(
                (resolve) => {

                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src = file;


                    script.onload = () => {

                        resolve();

                    };


                    script.onerror = () => {

                        console.error(
                            `VELNOX: Could not load ${file}`
                        );

                        resolve();

                    };


                    document.body.appendChild(
                        script
                    );

                }
            );

        }


        /* =====================================================
           LOAD HTML COMPONENTS
        ====================================================== */

        async function initializeWebsite() {


            await Promise.all([

                loadComponent(
                    "navbar",
                    "HTML/navbar.html"
                ),

                loadComponent(
                    "hero",
                    "HTML/hero.html"
                ),

                loadComponent(
                    "about",
                    "HTML/about.html"
                ),

                loadComponent(
                    "services",
                    "HTML/services.html"
                ),

                loadComponent(
                    "works",
                    "HTML/works.html"
                ),

                loadComponent(
                    "team",
                    "HTML/team.html"
                ),

                loadComponent(
                    "estimator",
                    "HTML/estimator.html"
                ),

                loadComponent(
                    "contact",
                    "HTML/contact.html"
                ),

                loadComponent(
                    "location",
                    "HTML/location.html"
                ),

                loadComponent(
                    "footer",
                    "HTML/footer.html"
                ),

                loadComponent(
                    "floating-instagram",
                    "HTML/floating-instagram.html"
                )

            ]);


            /* =================================================
               LOAD JAVASCRIPT
            ================================================= */


            const scripts = [

                "JS/navbar.js",

                "JS/hero.js",

                "JS/about.js",

                "JS/services.js",

                "JS/works.js",

                "JS/team.js",

                "JS/estimator.js",

                "JS/contact.js",

                "JS/footer.js",

                "JS/floating-instagram.js",

                "JS/project-modal.js",

                "JS/scroll-animation.js"

            ];


            for (
                const script of scripts
            ) {

                await loadScript(script);

            }


            /* =================================================
               FINAL SCROLLTRIGGER REFRESH
            ================================================= */

            if (
                typeof window.ScrollTrigger !==
                "undefined"
            ) {

                window.ScrollTrigger.refresh();

            }


            console.log(
                "✓ VELNOX Website Fully Loaded"
            );

        }


        /* =====================================================
           START WEBSITE
        ====================================================== */

        initializeWebsite();


    </script>
